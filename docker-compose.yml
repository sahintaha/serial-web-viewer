# Usage:
#   docker compose up -d
#
# Uncomment the devices section and adjust the paths to your serial devices.

services:
  serial-web-viewer:
    build: .
    container_name: serial-web-viewer
    restart: unless-stopped
    ports:
      # Only reachable from this machine — anyone who can open the UI can write to your devices
      - "127.0.0.1:3000:3000"
    environment:
      - BAUD_RATE=9600
      - DB_PATH=/app/data/serial-viewer.db
    volumes:
      # Production test results survive container restarts
      - ./data:/app/data
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    # group_add:
    #   - dialout
